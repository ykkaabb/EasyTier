name: Publish RTLS Prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v2.7.0-rtls.1
      core_run_id:
        description: Successful EasyTier Core workflow run ID
        required: true
      gui_run_id:
        description: Successful Windows GUI workflow run ID
        required: true

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Download Linux x86_64 Core
        uses: actions/download-artifact@v5
        with:
          name: easytier-linux-x86_64
          path: dist/linux-x86_64
          run-id: ${{ inputs.core_run_id }}
          github-token: ${{ github.token }}

      - name: Download Windows x86_64 Core
        uses: actions/download-artifact@v5
        with:
          name: easytier-windows-x86_64
          path: dist/windows-x86_64
          run-id: ${{ inputs.core_run_id }}
          github-token: ${{ github.token }}

      - name: Download Windows x86_64 GUI
        uses: actions/download-artifact@v5
        with:
          name: easytier-gui-windows-x86_64
          path: dist/gui-windows-x86_64
          run-id: ${{ inputs.gui_run_id }}
          github-token: ${{ github.token }}

      - name: Package release assets
        run: |
          set -euo pipefail
          mkdir -p release
          tar -C dist/linux-x86_64 -czf "release/easytier-linux-x86_64-${TAG}.tar.gz" .
          (cd dist/windows-x86_64 && zip -9 -r "../../release/easytier-windows-x86_64-${TAG}.zip" .)

          gui_installer="$(find dist/gui-windows-x86_64 -maxdepth 1 -type f -name '*.exe' -print -quit)"
          if [[ -z "$gui_installer" ]]; then
            echo "Windows GUI installer not found" >&2
            exit 1
          fi
          cp "$gui_installer" "release/easytier-gui-windows-x86_64-${TAG}-setup.exe"
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -lh release

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## RTLS milestone 1

          This prerelease adds REALITY-inspired TLS camouflage transport to the EasyTier fork while preserving the existing EasyTier network model.

          Included:
          - RTLS relay/configured-peer transport over TLS 1.3.
          - RTLS for TCP hole-punch P2P links with `disabled`, `allow`, and `require` policy modes.
          - Authenticated session tokens, TLS exporter proofs, replay protection, and cover-target fallback.
          - Linux x86_64 Core, Windows x86_64 Core, and Windows x86_64 GUI installer.

          Notes:
          - Windows binaries and the GUI installer are currently unsigned, so SmartScreen may show an unknown-publisher warning.
          - H3/QUIC camouflage, UDP P2P camouflage, GUI RTLS controls, and Android integration are not included in this milestone.
          - To require camouflage for direct TCP P2P, use `p2p_mode = "require"`. To prevent uncamouflaged UDP hole punching, also set `disable_udp_hole_punching = true`.

          See `docs/rtls-transport.md` and `_handoff/rtls-milestone-1/` for configuration and development handoff details.
          EOF

      - name: Create GitHub prerelease
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --prerelease \
            release/*
